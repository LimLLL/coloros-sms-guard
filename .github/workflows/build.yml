name: build

# Pushes and PRs only test and build. Pushing a tag vX.Y.Z (matching versionName) also
# publishes a GitHub Release with the signed APK.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          VERSION=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then
            echo "::error::versionName not found in app/build.gradle.kts"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # No wrapper jar is committed; the pinned Gradle version is provisioned here instead.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            # Users install releases over older versions, so a release must never be unsigned.
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::SIGNING_KEYSTORE_BASE64 is required for release builds"
              exit 1
            fi
            echo "::warning::SIGNING_KEYSTORE_BASE64 not set, APK will be unsigned"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and assemble
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon testDebugUnitTest assembleRelease

      - name: Collect APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          for apk in app/build/outputs/apk/release/*.apk; do
            suffix=""
            case "$apk" in *-unsigned.apk) suffix="-unsigned" ;; esac
            cp "$apk" "dist/coloros-sms-guard-v${VERSION}${suffix}.apk"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: smsguard-apk
          path: dist/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: smsguard-apk
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          LSPosed 模块：拦截 CVE-2025-10184（ColorOS / OxygenOS 上任意应用无需权限即可读取短信）。

          安装：下载下方 APK → LSPosed 中启用并勾选「电话/短信存储」「电话服务」→ 重启手机 → 打开应用点「自检」确认三项均为「已被本模块拦截」。详见 README。
          EOF
          gh release create "$TAG" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
